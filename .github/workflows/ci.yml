
name: University Assistant RAG - CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    name: Python Quality and Unit Tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Python syntax
        run: |
          python -m compileall -q src scripts tests

      - name: Test scope policy
        run: |
          python -m scripts.test_scope_policy
           
      - name: Test governance and prompt injection
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_governance.py" \
            -v


      - name: Test contradiction detection
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_contradiction.py" \
            -v

      - name: Check repository integrity
        run: |
          test -f dvc.yaml
          test -f dvc.lock
          test -f data/processed/text.dvc
          test -f data/evaluation/questions_annotated_v1.jsonl.dvc

      - name: Quality checks completed
        run: |
          echo "Python syntax: OK"
          echo "Scope policy tests: OK"
          echo "Contradiction unit tests: OK"
          echo "DVC metadata: present"
